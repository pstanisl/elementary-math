services:
  backend:
    build: ./backend
    networks:
      - app
    volumes:
      - math-data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/elementary_math.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    networks:
      - app
      - dokploy-network
    ports:
      - "3333:3000"
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.math.rule=Host(`math.raspberrypi5.internal`)"
      - "traefik.http.routers.math.entrypoints=websecure"
      - "traefik.http.routers.math.tls=true"
      - "traefik.http.services.math.loadbalancer.server.port=3000"

networks:
  app:
  dokploy-network:
    external: true

volumes:
  math-data:
